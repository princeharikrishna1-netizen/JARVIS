<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- JARVIS MAIN INTERFACE -->
    <main class="jarvis">

        <!-- TOP HUD -->
        <header class="top-hud">

            <div class="system-name">
                <span class="small-text">STARK INDUSTRIES</span>
                <span class="main-text">J.A.R.V.I.S</span>
            </div>

            <div class="system-status">
                <span class="status-light"></span>
                <span>SYSTEM ONLINE</span>
            </div>

        </header>


        <!-- MAIN HUD AREA -->
        <section class="hud-area">

            <!-- LEFT HUD -->
            <div class="hud-panel left-panel">

                <div class="panel-title">
                    SYSTEM
                </div>

                <div class="data-line">
                    <span>CORE</span>
                    <span id="coreStatus">ONLINE</span>
                </div>

                <div class="data-line">
                    <span>VOICE</span>
                    <span id="voiceStatus">READY</span>
                </div>

                <div class="data-line">
                    <span>AI</span>
                    <span id="aiStatus">STANDBY</span>
                </div>

                <div class="data-line">
                    <span>MEMORY</span>
                    <span id="memoryStatus">ACTIVE</span>
                </div>

            </div>


            <!-- CENTRAL JARVIS CORE -->
            <div class="jarvis-core">

                <div class="outer-ring ring-one"></div>
                <div class="outer-ring ring-two"></div>
                <div class="outer-ring ring-three"></div>

                <div class="energy-ring">

                    <div class="energy-segment segment-one"></div>
                    <div class="energy-segment segment-two"></div>
                    <div class="energy-segment segment-three"></div>
                    <div class="energy-segment segment-four"></div>

                </div>

                <div class="core">

                    <div class="core-inner"></div>

                    <div class="core-text">
                        J
                    </div>

                </div>

            </div>


            <!-- RIGHT HUD -->
            <div class="hud-panel right-panel">

                <div class="panel-title">
                    DIAGNOSTICS
                </div>

                <div class="data-line">
                    <span>CPU</span>
                    <span id="cpuStatus">NORMAL</span>
                </div>

                <div class="data-line">
                    <span>NETWORK</span>
                    <span id="networkStatus">CONNECTED</span>
                </div>

                <div class="data-line">
                    <span>SECURITY</span>
                    <span id="securityStatus">ACTIVE</span>
                </div>

                <div class="data-line">
                    <span>MODE</span>
                    <span id="modeStatus">JARVIS</span>
                </div>

            </div>

        </section>


        <!-- HOLOGRAM MESSAGE -->
        <section class="message-area">

            <div class="message-line"></div>

            <div id="jarvisMessage">
                GOOD EVENING, BOSS.
            </div>

            <div class="message-sub">
                J.A.R.V.I.S INITIALIZATION COMPLETE
            </div>

        </section>


        <!-- VOICE BUTTON -->
        <section class="voice-section">

            <button id="voiceButton" class="voice-button">

                <span class="mic-icon">🎙</span>

                <span class="voice-text">
                    ACTIVATE JARVIS
                </span>

            </button>

        </section>


        <!-- BOTTOM HUD -->
        <footer class="bottom-hud">

            <div>
                <span class="bottom-label">TIME</span>
                <span id="time">--:--:--</span>
            </div>

            <div>
                <span class="bottom-label">DATE</span>
                <span id="date">--/--/----</span>
            </div>

            <div>
                <span class="bottom-label">LOCATION</span>
                <span id="location">SEARCHING...</span>
            </div>

        </footer>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
